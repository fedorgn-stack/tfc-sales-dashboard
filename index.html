function Card({ children, className = '' }) {
  return (
    <div className={`bg-white border border-[#e4ddcd] rounded-sm ${className}`} style={{ boxShadow: '0 1px 0 rgba(0,0,0,0.03)' }}>
      {children}
    </div>
  );
}

function KPI({ label, value, sub, accent }) {
  return (
    <Card className="p-5 flex-1 min-w-[150px]">
      <div className="text-[11px] uppercase tracking-wider" style={{ color: '#8a8272', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>{label}</div>
      <div className="text-3xl mt-1" style={{ color: ink, fontWeight: 600, fontFamily: 'Georgia, serif' }}>{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: accent || '#8a8272' }}>{sub}</div>}
    </Card>
  );
}

const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: ink, color: paper, padding: '8px 12px', fontSize: 12, borderRadius: 2 }}>
      <div style={{ opacity: 0.7, marginBottom: 4 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <span>{p.name}:</span><span style={{ fontWeight: 600 }}>{p.value}</span>
        </div>
      ))}
    </div>
  );
};

function DealsTable({ deals, kind }) {
  const [query, setQuery] = useState('');
  const [managerFilter, setManagerFilter] = useState('Все');
  const managers = useMemo(() => ['Все', ...Array.from(new Set(deals.map(d => d.manager)))], [deals]);

  const filtered = useMemo(() => {
    return deals.filter(d => {
      const matchesQuery = query.trim() === '' || d.org.toLowerCase().includes(query.toLowerCase());
      const matchesManager = managerFilter === 'Все' || d.manager === managerFilter;
      return matchesQuery && matchesManager;
    });
  }, [deals, query, managerFilter]);

  const accent = kind === 'success' ? '#4c8c5b' : '#b04a3f';

  return (
    <Card className="p-5">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="text-sm" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>
          {kind === 'success' ? 'СДЕЛКИ В УСПЕХЕ' : 'СДЕЛКИ В ОТКАЗЕ'} · {filtered.length} из {deals.length}
        </div>
        <div className="flex gap-2">
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Поиск по компании..."
            className="text-xs px-2 py-1 rounded-sm outline-none"
            style={{ border: `1px solid ${line}`, background: paper }}
          />
          <select
            value={managerFilter}
            onChange={e => setManagerFilter(e.target.value)}
            className="text-xs px-2 py-1 rounded-sm outline-none"
            style={{ border: `1px solid ${line}`, background: paper }}
          >
            {managers.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>
      <div className="overflow-auto" style={{ maxHeight: 420 }}>
        <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${line}` }}>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Дата</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Компания</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Менеджер</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>{kind === 'success' ? 'Этап' : 'Причина'}</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((d, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${line}` }}>
                <td className="py-2 pr-3" style={{ color: '#8a8272', whiteSpace: 'nowrap' }}>{d.date}</td>
                <td className="py-2 pr-3" style={{ fontWeight: 500 }}>{d.org}</td>
                <td className="py-2 pr-3">{d.manager}</td>
                <td className="py-2 pr-3" style={{ color: accent }}>{kind === 'success' ? d.stage : d.reason}</td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={4} className="py-4 text-center" style={{ color: '#8a8272' }}>Ничего не найдено</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </Card>
  );
}
