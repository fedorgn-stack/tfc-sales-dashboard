function Card({ children, className = '' }) {
  return (
    <div className={`bg-white border border-[#e4ddcd] rounded-sm ${className}`} style={{ boxShadow: '0 1px 0 rgba(0,0,0,0.03)' }}>
      {children}
    </div>
  );
}

function KPI({ label, value, sub, accent }) {
  return (
    <Card className="p-5 flex-1 min-w-[150px]">
      <div className="text-[11px] uppercase tracking-wider" style={{ color: '#8a8272', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>{label}</div>
      <div className="text-3xl mt-1" style={{ color: ink, fontWeight: 600, fontFamily: 'Georgia, serif' }}>{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: accent || '#8a8272' }}>{sub}</div>}
    </Card>
  );
}

const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: ink, color: paper, padding: '8px 12px', fontSize: 12, borderRadius: 2 }}>
      <div style={{ opacity: 0.7, marginBottom: 4 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <span>{p.name}:</span><span style={{ fontWeight: 600 }}>{p.value}</span>
        </div>
      ))}
    </div>
  );
};

function DealsTable({ deals, kind }) {
  const [query, setQuery] = useState('');
  const [managerFilter, setManagerFilter] = useState('Все');
  const managers = useMemo(() => ['Все', ...Array.from(new Set(deals.map(d => d.manager)))], [deals]);

  const filtered = useMemo(() => {
    return deals.filter(d => {
      const matchesQuery = query.trim() === '' || d.org.toLowerCase().includes(query.toLowerCase());
      const matchesManager = managerFilter === 'Все' || d.manager === managerFilter;
      return matchesQuery && matchesManager;
    });
  }, [deals, query, managerFilter]);

  const accent = kind === 'success' ? '#4c8c5b' : '#b04a3f';

  return (
    <Card className="p-5">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="text-sm" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>
          {kind === 'success' ? 'СДЕЛКИ В УСПЕХЕ' : 'СДЕЛКИ В ОТКАЗЕ'} · {filtered.length} из {deals.length}
        </div>
        <div className="flex gap-2">
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Поиск по компании..."
            className="text-xs px-2 py-1 rounded-sm outline-none"
            style={{ border: `1px solid ${line}`, background: paper }}
          />
          <select
            value={managerFilter}
            onChange={e => setManagerFilter(e.target.value)}
            className="text-xs px-2 py-1 rounded-sm outline-none"
            style={{ border: `1px solid ${line}`, background: paper }}
          >
            {managers.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>
      <div className="overflow-auto" style={{ maxHeight: 420 }}>
        <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${line}` }}>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Дата</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Компания</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>Менеджер</th>
              <th className="text-left py-2 pr-3" style={{ color: '#8a8272', fontWeight: 500 }}>{kind === 'success' ? 'Этап' : 'Причина'}</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((d, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${line}` }}>
                <td className="py-2 pr-3" style={{ color: '#8a8272', whiteSpace: 'nowrap' }}>{d.date}</td>
                <td className="py-2 pr-3" style={{ fontWeight: 500 }}>{d.org}</td>
                <td className="py-2 pr-3">{d.manager}</td>
                <td className="py-2 pr-3" style={{ color: accent }}>{kind === 'success' ? d.stage : d.reason}</td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={4} className="py-4 text-center" style={{ color: '#8a8272' }}>Ничего не найдено</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

                <div className="flex flex-col gap-1 mt-2">
                  {channelData.map((d, i) => (
                    <div key={i} className="flex items-center justify-between text-xs">
                      <span className="flex items-center gap-2"><span style={{ width: 8, height: 8, background: d.color, display: 'inline-block', borderRadius: 2 }}></span>{d.name}</span>
                      <span style={{ fontWeight: 600 }}>{d.value}</span>
                    </div>
                  ))}
                </div>
              </Card>

              {/* Calc pie */}
              <Card className="p-5">
                <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>ПРОСЧЁТЫ ЗАКАЗОВ</div>
                <ResponsiveContainer width="100%" height={200}>
                  <PieChart>
                    <Pie data={calcData} dataKey="value" nameKey="name" innerRadius={45} outerRadius={75} paddingAngle={2}>
                      {calcData.map((d, i) => <Cell key={i} fill={d.color} />)}
                    </Pie>
                    <Tooltip content={<CustomTooltip />} />
                  </PieChart>
                </ResponsiveContainer>
                <div className="flex flex-col gap-1 mt-2">
                  {calcData.map((d, i) => (
                    <div key={i} className="flex items-center justify-between text-xs">
                      <span className="flex items-center gap-2"><span style={{ width: 8, height: 8, background: d.color, display: 'inline-block', borderRadius: 2 }}></span>{d.name}</span>
                      <span style={{ fontWeight: 600 }}>{d.value}</span>
                    </div>
                  ))}
                </div>
              </Card>
            </div>

            <Card className="p-5 mt-4">
              <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>НОВЫЕ СДЕЛКИ ПО МЕСЯЦАМ (дата первого контакта)</div>
              <ResponsiveContainer width="100%" height={180}>
                <BarChart data={monthData}>
                  <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                  <XAxis dataKey="month" tick={{ fontSize: 12, fill: ink }} axisLine={{ stroke: line }} />
                  <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                  <Bar dataKey="count" fill={rust} radius={[3, 3, 0, 0]}>
                    <LabelList dataKey="count" position="top" style={{ fontSize: 12, fill: ink, fontWeight: 600 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
              <div className="text-xs mt-2" style={{ color: '#8a8272' }}>Резкий рост в феврале — активная работа по базе (94 сделки из базы vs 57 самостоятельный поиск).</div>
            </Card>
          </>
        )}

        {tab === 'funnel' && (
          <>
            <Card className="p-5 mb-4">
              <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>НОВЫЕ ЛИДЫ ПО НЕДЕЛЯМ (по дате первого контакта из детального списка сделок)</div>
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={newLeadsWeekly}>
                  <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                  <XAxis dataKey="week" tick={{ fontSize: 10, fill: '#8a8272' }} axisLine={{ stroke: line }} angle={-20} textAnchor="end" height={50} />
                  <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                  <Bar dataKey="count" name="Новых лидов" fill={steel} radius={[3, 3, 0, 0]}>
                    <LabelList dataKey="count" position="top" style={{ fontSize: 11, fill: ink, fontWeight: 600 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
              <div className="text-xs mt-2" style={{ color: '#8a8272' }}>
                Скачок 16–22.02 (95 лидов) — не органический поток, а массовая выгрузка/добавление базы одной датой. Официальный столбец «Кол-во новых лидов» в сводном недельном блоке таблицы не заполняется (везде 0) — если хочешь, чтобы график шёл именно оттуда, надо начать вносить туда цифры.
              </div>
            </Card>

            <div className="text-xs mb-4 px-1" style={{ color: '#8a8272' }}>Ниже — данные из отдельного сводного еженедельного блока таблицы (лист «воронка холода»). Заполнены 4 недели — 16.03 по 12.04.</div>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <Card className="p-5">
                <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>ВСЕГО В ВОРОНКЕ НА КОНЕЦ НЕДЕЛИ</div>
                <ResponsiveContainer width="100%" height={240}>
                  <LineChart data={weeklyFunnel}>
                    <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                    <XAxis dataKey="week" tick={{ fontSize: 10, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                    <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} domain={[80, 140]} />
                    <Tooltip content={<CustomTooltip />} />
                    <Line type="monotone" dataKey="inFunnel" name="В воронке" stroke={steel} strokeWidth={2.5} dot={{ r: 4, fill: steel }} />
                  </LineChart>
                </ResponsiveContainer>
              </Card>

              <Card className="p-5">
                <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>ПЕРЕВЕДЕНО В УСПЕХ / ОТКАЗ ПО НЕДЕЛЯМ</div>
                <ResponsiveContainer width="100%" height={240}>
                  <BarChart data={weeklyFunnel}>
                    <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                    <XAxis dataKey="week" tick={{ fontSize: 10, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                    <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                    <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                    <Bar dataKey="toSuccess" name="В успех" fill="#4c8c5b" radius={[3, 3, 0, 0]} />
                    <Bar dataKey="toReject" name="В отказ" fill="#b04a3f" radius={[3, 3, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </Card>
            </div>

            <Card className="p-5">
              <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>КОЛИЧЕСТВО ПРОСЧЁТОВ ПО НЕДЕЛЯМ</div>
              <ResponsiveContainer width="100%" height={180}>
                <BarChart data={weeklyFunnel}>
                  <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                  <XAxis dataKey="week" tick={{ fontSize: 10, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                  <Bar dataKey="calcs" name="Просчётов" fill={rust} radius={[3, 3, 0, 0]}>
                    <LabelList dataKey="calcs" position="top" style={{ fontSize: 12, fill: ink, fontWeight: 600 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
              <div className="text-xs mt-2" style={{ color: '#8a8272' }}>Данные за 30.03–12.04 не заполнены в источнике — новых лидов 0 все 4 недели подряд, стоит проверить, вносятся ли данные вовремя.</div>
            </Card>
          </>
        )}

        {tab === 'managers' && (
          <>
            <Card className="p-5 mb-4">
              <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>СТАТУС СДЕЛОК ПО МЕНЕДЖЕРАМ</div>
              <ResponsiveContainer width="100%" height={280}>
                <BarChart data={managerData}>
                  <CartesianGrid strokeDasharray="3 3" stroke={line} vertical={false} />
                  <XAxis dataKey="manager" tick={{ fontSize: 12, fill: ink }} axisLine={{ stroke: line }} />
                  <YAxis tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="В работе" stackId="a" fill={steel} />
                  <Bar dataKey="Успех" stackId="a" fill="#4c8c5b" />
                  <Bar dataKey="Отказ" stackId="a" fill="#b04a3f" radius={[3, 3, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </Card>

            <Card className="p-5">
              <div className="text-sm mb-3" style={{ color: '#8a8272', fontFamily: 'ui-monospace, monospace' }}>ЭТАП × СТАТУС (где застревают сделки)</div>
              <ResponsiveContainer width="100%" height={280}>
                <BarChart data={stageStatusStack} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke={line} horizontal={false} />
                  <XAxis type="number" tick={{ fontSize: 11, fill: '#8a8272' }} axisLine={{ stroke: line }} />
                  <YAxis type="category" dataKey="stage" tick={{ fontSize: 11, fill: ink }} width={120} axisLine={{ stroke: line }} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="В работе" stackId="a" fill={steel} />
                  <Bar dataKey="Успех" stackId="a" fill="#4c8c5b" />
                  <Bar dataKey="Отказ" stackId="a" fill="#b04a3f" />
                </BarChart>
              </ResponsiveContainer>
              <div className="text-xs mt-2" style={{ color: '#8a8272' }}>67 сделок висят на этапе "Лид" в статусе "В работе" — самое узкое место воронки, стоит продвигать их до КП.</div>
            </Card>
          </>
        )}

        {tab === 'deals' && (
          <div className="grid grid-cols-2 gap-4">
            <DealsTable deals={successDeals} kind="success" />
            <DealsTable deals={rejectDeals} kind="reject" />
          </div>
        )}

        <div className="text-xs mt-6 pt-4 border-t" style={{ borderColor: line, color: '#8a8272' }}>
          Источник: Google Sheet «Воронка продаж TFC». Цифры пересчитаны на момент выгрузки — для автообновления нужен рабочий Google Drive/Sheets коннектор.
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);

</script>
</body>
</html>
